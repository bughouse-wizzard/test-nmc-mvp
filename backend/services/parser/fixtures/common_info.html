<!DOCTYPE html>
<html>
<head>
    <title>Contract Common Info</title>
</head>
<body>
    <div class="contract-info">
        <h1>Contract Information</h1>
        
        <div class="info-section">
            <div class="info-row">
                <span class="label">Реестровый номер:</span>
                <span class="value">1234567890</span>
            </div>
            <div class="info-row">
                <span class="label">Дата заключения контракта:</span>
                <span class="value">15.12.2024</span>
            </div>
            <div class="info-row">
                <span class="label">Заказчик:</span>
                <span class="value">Министерство цифрового развития РФ</span>
            </div>
            <div class="info-row">
                <span class="label">Поставщик:</span>
                <span class="value">ООО "Технологии Будущего"</span>
            </div>
            <div class="info-row">
                <span class="label">Цена контракта:</span>
                <span class="value">1 500 000,00 ₽</span>
            </div>
            <div class="info-row">
                <span class="label">Валюта:</span>
                <span class="value">RUB</span>
            </div>
            <div class="info-row">
                <span class="label">Статус исполнения:</span>
                <span class="value">Исполняется</span>
            </div>
        </div>
    </div>
</body>
</html>
